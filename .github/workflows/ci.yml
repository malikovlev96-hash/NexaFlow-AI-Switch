name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript
        run: node --check server/index.js
      - name: Validate JSON manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('mobile/manifest.webmanifest','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
      - name: Run tests
        run: npm test
      - name: Build MCPB
        run: python3 tools/build_mcpb.py
      - name: Verify archive
        run: python3 tools/verify_mcpb.py
