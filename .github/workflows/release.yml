name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run tests
        run: npm test

      - name: Validate source
        run: npm run check

      - name: Build MCPB
        run: python tools/build_mcpb.py

      - name: Verify MCPB archive
        run: python tools/verify_mcpb.py dist/NexaFlow-AI-Switch-1.7.0.mcpb

      - name: Create source download
        run: |
          git archive --format=zip --output=dist/NexaFlow-AI-Switch-1.7.0-source.zip HEAD

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NexaFlow AI Switch 1.7.0
          files: |
            dist/NexaFlow-AI-Switch-1.7.0.mcpb
            dist/NexaFlow-AI-Switch-1.7.0-source.zip
          generate_release_notes: true
