name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          SOURCE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          else
            echo "Release workflow must be started by pushing a version tag."
            exit 1
          fi
          if [[ "$RELEASE_VERSION" != "$SOURCE_VERSION" ]]; then
            echo "Tag version $RELEASE_VERSION does not match package.json $SOURCE_VERSION"
            exit 1
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate MCPB manifest with official Anthropic CLI
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json

      - name: Run tests
        run: npm test

      - name: Validate source
        run: npm run check

      - name: Build MCPB
        run: python tools/build_mcpb.py

      - name: Verify MCPB archive
        run: python tools/verify_mcpb.py "dist/NexaFlow-AI-Switch-${{ steps.version.outputs.version }}.mcpb"

      - name: Create source download
        run: |
          git archive --format=zip --output="dist/NexaFlow-AI-Switch-${{ steps.version.outputs.version }}-source.zip" HEAD

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NexaFlow AI Switch ${{ steps.version.outputs.version }}
          files: |
            dist/NexaFlow-AI-Switch-${{ steps.version.outputs.version }}.mcpb
            dist/NexaFlow-AI-Switch-${{ steps.version.outputs.version }}-source.zip
          generate_release_notes: true
